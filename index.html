<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCHMOOZE</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
    margin: 0;
    background: #0b0b0b;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    font-size: 20px; /* BIGGER BODY TEXT */
}

/* HALFTONE BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://www.transparenttextures.com/patterns/dots.png");
    opacity: 0.25;
    z-index: 0;
}

/* FILM GRAIN */
body::after {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://www.transparenttextures.com/patterns/noise.png");
    opacity: 0.1;
    animation: flicker 0.4s infinite;
    z-index: 1;
}

@keyframes flicker {
    0% { opacity: 0.08; }
    50% { opacity: 0.15; }
    100% { opacity: 0.08; }
}

/* KEEP CONTENT ABOVE TEXTURE */
* {
    position: relative;
    z-index: 2;
}

/* NAV */
nav {
    display: flex;
    justify-content: space-between;
    padding: 20px;
    background: rgba(0,0,0,0.7);
}

nav img {
    height: 50px;
}

nav a {
    margin-left: 20px;
    color: white;
    text-decoration: none;
}

nav a:hover {
    color: #ff2e7a;
}

/* HERO */
.hero {
    height: 100vh;
    background: url("https://pasteboard.co/TjOPaSKcWwgf.jpg") center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero h1 {
    font-family: 'Bebas Neue';
    font-size: 100px;
    color: #ff2e2e;
}

/* SECTION */
.section {
    max-width: 1000px;
    margin: 80px auto;
    padding: 0 20px;
}

.section h2 {
    font-family: 'Bebas Neue';
    font-size: 50px;
    color: #ff2e2e;
    border-bottom: 3px solid #ff7a00;
    margin-bottom: 30px;
}

/* SHOWS */
.show {
    display: flex;
    justify-content: space-between;
    padding: 15px 0;
    border-bottom: 1px dashed #555;
    font-size: 22px;
}

.ticket-btn {
    border: 2px solid #ff2e7a;
    padding: 6px 12px;
    text-decoration: none;
    color: white;
}

.ticket-btn:hover {
    background: #ff2e7a;
}

/* ICON LINKS */
.icons {
    display: flex;
    gap: 20px;
    font-size: 30px;
}

.icons a {
    color: white;
}

.icons a:hover {
    color: #ff7a00;
}

/* RELEASES */
.release {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
}

.release img {
    width: 120px;
}

/* MERCH GRID */
.merch-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.merch-grid img {
    width: 100%;
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 20px;
    border: 2px solid #ff2e2e;
    text-decoration: none;
    color: white;
}

.button:hover {
    background: #ff2e2e;
}

/* EMAIL */
input {
    width: 100%;
    padding: 15px;
    font-size: 18px;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    margin-top: 10px;
    border: 2px solid #ff2e2e;
    background: black;
    color: white;
}

button:hover {
    background: #ff2e2e;
}

</style>
</head>

<body>

<nav>

</html>
