<title>SCHMOOZE</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@700&family=Barlow:wght@400;600&family=Montserrat:wght@100;400;700&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
    margin: 0;
    background: #0b0b0b;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
}

/* HALFTONE LAYER */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://www.transparenttextures.com/patterns/dots.png");
    opacity: 0.07;
    pointer-events: none;
    z-index: 0;
    animation: halftoneMove 18s linear infinite;
}

/* FILM GRAIN */
body::after {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://www.transparenttextures.com/patterns/noise.png");
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
    animation: grainMove 0.5s steps(2) infinite;
}

/* ANIMATIONS */
@keyframes halftoneMove {
    0% { transform: translate(0,0); }
    50% { transform: translate(-12px, 8px); }
    100% { transform: translate(0,0); }
}

@keyframes grainMove {
    0% { transform: translate(0,0); }
    25% { transform: translate(-2px,2px); }
    50% { transform: translate(2px,-2px); }
    75% { transform: translate(-1px,-1px); }
    100% { transform: translate(0,0); }
}

/* KEEP CONTENT ABOVE TEXTURE */
* {
    position: relative;
    z-index: 1;
}

/* HERO */
.hero {
    text-align: center;
    padding: 100px 20px 60px;
}

.hero h1 {
    font-family: 'Bebas Neue';
    font-size: 140px;
    color: #ff2e2e;
    margin: 0;
    letter-spacing: 4px;
    transform: rotate(-1deg);
}

.hero h2 {
    font-family: 'Montserrat';
    font-weight: 100;
    font-size: 32px;
    margin-top: 10px;
    transform: rotate(1deg);
}

/* SECTIONS */
.section {
    max-width: 1000px;
    margin: 25px auto;
    padding: 0 20px;
}

/* HEADERS */
.glitch {
    font-family: 'Bebas Neue';
    font-size: 52px;
    color: #ff2e2e;
    transform: rotate(-1deg);
}

/* GLITCH ON HOVER */
.glitch:hover {
    text-shadow: 
        2px 0 #ff7a00,
        -2px 0 #ff00ff;
}

/* SUBTEXT */
.subtext {
    font-family: 'Montserrat';
    font-weight: 100;
    font-size: 28px;
}

/* LINKS */
a {
    color: white;
    text-decoration: none;
}

a:hover {
    color: #ff7a00;
}

/* SHOWS */
.show {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed #555;
    padding: 6px 0;
    font-family: 'Montserrat';
    font-weight: 100;
    font-size: 28px;
}

/* BUTTON */
.ticket-btn {
    border: 2px solid #ff2e2e;
    padding: 4px 10px;
    font-family: 'Montserrat';
    font-weight: 100;
}

.ticket-btn:hover {
    background: #ff2e2e;
}

/* RELEASES */
.release {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
}

.release img {
    width: 120px;
    border: 2px solid #ff2e2e;
}

/* PHOTO GRID */
.photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 10px;
}

.photo-grid img {
    width: 100%;
    border: 2px solid #fff;
    transform: rotate(-1deg);
    transition: 0.2s;
}

.photo-grid img:hover {
    transform: rotate(1deg) scale(1.02);
}

/* VIDEO GRID */
.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 10px;
}

.video-grid iframe {
    width: 100%;
    height: 180px;
    border: 2px solid #fff;
    transform: rotate(1deg);
}

/* EMAIL */
input, button {
    font-family: 'Montserrat';
    font-weight: 100;
    padding: 12px;
    font-size: 18px;
}

button {
    border: 2px solid #ff2e2e;
    background: black;
    color: white;
}

button:hover {
    background: #ff2e2e;
}

</style>
</head>
